# k8s/infra/namespaces.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: buildrix-core

---
# to create a separate ns for previews

apiVersion: v1
kind: Namespace
metadata:
  name: buildrix-previews

---
# configmap for shared config values across services

apiVersion: v1
kind: ConfigMap
metadata:
  name: buildrix-shared-config
  namespace: buildrix-core
data:
  PREVIEW_DOMAIN: "127.0.0.1.nip.io"
  PREVIEW_NAMESPACE: "buildrix-previews"
  PROXY_PORT: "80"
  APP_FRONTEND_URL: "http://localhost:8080"

