# k8s/infra/core-network-policies.yaml

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-only
  namespace: buildrix-core
spec:
  podSelector: {} # Applies to all pods in buildrix-core
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: buildrix-core

---
# 2. NEW POLICY: Allow Previews to talk to MinIO (for file storage)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-previews-to-minio
  namespace: buildrix-core
spec:
  # Target ONLY the MinIO pod
  podSelector: 
    matchLabels:
      app: minio
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic FROM the buildrix-previews namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: buildrix-previews
      # ONLY on port 9000
      ports:
        - protocol: TCP
          port: 9000

---
# 3. NEW POLICY: Allow NGINX Ingress to talk to API Gateway and Proxy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nginx-ingress
  namespace: buildrix-core
spec:
  # This applies to the services Nginx needs to reach
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["api-gateway", "buildrix-proxy"]
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic FROM the ingress-nginx namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx