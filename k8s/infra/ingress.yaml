apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: buildrix-main-ingress
  namespace: buildrix-core
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: "nginx"
  rules:
  # 1. Previews Route (*.127.0.0.1.nip.io or *.previews.buildrix.ai)
  - host: "*.127.0.0.1.nip.io"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: buildrix-proxy
            port:
              number: 80
  
  # 2. API Gateway Route
  - host: "api.127.0.0.1.nip.io"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80